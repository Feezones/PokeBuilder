<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéBuilder</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="PokéBall" width="64" height="64" style="image-rendering:pixelated">
      <h2>PokéBuilder</h2>
      <p class="login-subtitle" data-i18n="login.subtitle">Enter your trainer name to access your teams</p>
      <div class="login-form">
        <input type="text" id="login-nick" class="search-input login-input" placeholder="Trainer name..." data-i18n-placeholder="login.placeholder" maxlength="20" autocomplete="off">
        <button id="login-btn" class="btn btn-primary login-btn" data-i18n="login.login">Log in</button>
      </div>
      <div class="login-profiles" id="login-profiles">
        <p class="login-profiles-label" data-i18n="login.savedProfiles">Saved profiles:</p>
        <div class="login-profiles-list" id="login-profiles-list"></div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="header" id="app-header" style="display:none;">
    <div class="header-left">
      <div class="logo">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="PokéBall" width="32" height="32">
        <h1>PokéBuilder</h1>
      </div>
      <div class="trainer-badge" id="trainer-badge">
        <span class="trainer-name" id="trainer-name"></span>
        <button class="icon-btn btn-sm" id="btn-logout" title="Logout">🚪</button>
      </div>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="icon-btn" title="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
      <div class="lang-selector">
        <button id="lang-toggle" class="icon-btn lang-btn">
          <span id="lang-label">EN</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav-tabs" id="app-nav" style="display:none;">
    <button class="nav-tab active" data-tab="teambuilder" data-i18n="nav.teambuilder">Team Builder</button>
    <button class="nav-tab" data-tab="damage-calc" data-i18n="nav.damageCalc">Damage Calculator</button>
    <button class="nav-tab" data-tab="iv-ev-calc" data-i18n="nav.ivEvCalc">IV/EV Calculator</button>
  </nav>

  <!-- Main Content -->
  <main class="main-content" id="app-main" style="display:none;">
    <!-- Team Builder View -->
    <section id="view-teambuilder" class="view active">
      <!-- Team Tabs -->
      <div class="team-tabs-bar" id="team-tabs-bar">
        <div class="team-tabs" id="team-tabs">
          <!-- Generated by JS -->
        </div>
        <button class="btn btn-sm btn-secondary" id="btn-add-team" title="New team">＋</button>
      </div>

      <div class="tb-toolbar">
        <button id="btn-import" class="btn btn-secondary" data-i18n="tb.import">Import</button>
        <button id="btn-export" class="btn btn-secondary" data-i18n="tb.export">Export</button>
        <button id="btn-clear" class="btn btn-danger" data-i18n="tb.clearTeam">Clear Team</button>
        <button id="btn-rename-team" class="btn btn-secondary" data-i18n="tb.renameTeam">✏️ Rename</button>
        <button id="btn-delete-team" class="btn btn-danger" data-i18n="tb.deleteTeam">🗑️ Delete Team</button>
      </div>

      <div class="team-slots" id="team-slots">
        <!-- 6 slots generated by JS -->
      </div>

      <div class="pokemon-editor" id="pokemon-editor" style="display:none;">
        <div class="editor-grid">
          <!-- Left Column: Basic Info -->
          <div class="editor-col editor-basic">
            <div class="pokemon-header">
              <div class="pokemon-sprite-container">
                <img id="editor-sprite" class="pokemon-sprite" src="" alt="">
                <div class="pokemon-types" id="editor-types"></div>
              </div>
              <div class="pokemon-search-wrap">
                <label data-i18n="tb.pokemon">Pokémon</label>
                <div class="searchable-select" id="pokemon-search">
                  <input type="text" class="search-input" placeholder="Search Pokémon..." data-i18n-placeholder="tb.searchPokemon">
                  <div class="search-dropdown"></div>
                </div>
              </div>
            </div>

            <div class="editor-row">
              <div class="editor-field">
                <label data-i18n="tb.ability">Ability</label>
                <div class="field-with-info">
                  <select id="editor-ability" class="select-input"></select>
                  <button class="info-btn" id="btn-ability-info" title="Info">i</button>
                </div>
              </div>
              <div class="editor-field">
                <label data-i18n="tb.item">Item</label>
                <div class="field-with-info">
                  <div class="searchable-select" id="item-search">
                    <input type="text" class="search-input" placeholder="Search item..." data-i18n-placeholder="tb.searchItem">
                    <div class="search-dropdown"></div>
                  </div>
                  <button class="info-btn" id="btn-item-info" title="Info">i</button>
                </div>
              </div>
            </div>

            <div class="editor-row">
              <div class="editor-field">
                <label data-i18n="tb.nature">Nature</label>
                <select id="editor-nature" class="select-input"></select>
              </div>
              <div class="editor-field">
                <label data-i18n="tb.level">Level</label>
                <input type="number" id="editor-level" class="num-input" min="1" max="100" value="50">
              </div>
            </div>

            <div class="editor-moves">
              <label data-i18n="tb.moves">Moves</label>
              <div class="moves-grid">
                <div class="move-with-info">
                  <div class="searchable-select move-select" id="move-search-0">
                    <input type="text" class="search-input" placeholder="Move 1" data-i18n-placeholder="tb.move1">
                    <div class="search-dropdown"></div>
                  </div>
                  <button class="info-btn" data-move-index="0" title="Info">i</button>
                </div>
                <div class="move-with-info">
                  <div class="searchable-select move-select" id="move-search-1">
                    <input type="text" class="search-input" placeholder="Move 2" data-i18n-placeholder="tb.move2">
                    <div class="search-dropdown"></div>
                  </div>
                  <button class="info-btn" data-move-index="1" title="Info">i</button>
                </div>
                <div class="move-with-info">
                  <div class="searchable-select move-select" id="move-search-2">
                    <input type="text" class="search-input" placeholder="Move 3" data-i18n-placeholder="tb.move3">
                    <div class="search-dropdown"></div>
                  </div>
                  <button class="info-btn" data-move-index="2" title="Info">i</button>
                </div>
                <div class="move-with-info">
                  <div class="searchable-select move-select" id="move-search-3">
                    <input type="text" class="search-input" placeholder="Move 4" data-i18n-placeholder="tb.move4">
                    <div class="search-dropdown"></div>
                  </div>
                  <button class="info-btn" data-move-index="3" title="Info">i</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Column: Stats -->
          <div class="editor-col editor-stats">
            <div class="stats-section">
              <h3 data-i18n="tb.evs">EVs <span class="ev-counter" id="ev-counter">(0/510)</span></h3>
              <div class="stat-rows" id="ev-sliders">
                <!-- Generated by JS -->
              </div>
            </div>

            <div class="stats-section">
              <h3 data-i18n="tb.ivs">IVs</h3>
              <div class="stat-rows" id="iv-inputs">
                <!-- Generated by JS -->
              </div>
            </div>

            <div class="stats-section final-stats">
              <h3 data-i18n="tb.finalStats">Final Stats</h3>
              <div class="stat-bars" id="final-stats">
                <!-- Generated by JS -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Import/Export Modal -->
      <div class="modal" id="modal-import-export" style="display:none;">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="modal-title">Import / Export</h2>
            <button class="modal-close" id="modal-close">&times;</button>
          </div>
          <div class="modal-body">
            <textarea id="modal-textarea" class="modal-textarea" rows="15" placeholder="Paste Showdown format here..."></textarea>
          </div>
          <div class="modal-footer">
            <button id="modal-action" class="btn btn-primary">Import</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Damage Calculator View -->
    <section id="view-damage-calc" class="view">
      <div class="damage-calc-layout">
        <!-- Attacker -->
        <div class="calc-panel attacker-panel">
          <h2 data-i18n="dc.attacker">Attacker</h2>
          <div class="calc-pokemon-select">
            <div class="searchable-select" id="dc-atk-pokemon-search">
              <input type="text" class="search-input" placeholder="Search Pokémon..." data-i18n-placeholder="tb.searchPokemon">
              <div class="search-dropdown"></div>
            </div>
            <img id="dc-atk-sprite" class="calc-sprite" src="" alt="">
          </div>
          <div class="calc-fields">
            <div class="calc-row">
              <label data-i18n="tb.level">Level</label>
              <input type="number" id="dc-atk-level" class="num-input" min="1" max="100" value="50">
            </div>
            <div class="calc-row">
              <label data-i18n="tb.nature">Nature</label>
              <select id="dc-atk-nature" class="select-input"></select>
            </div>
            <div class="calc-row">
              <label data-i18n="tb.ability">Ability</label>
              <div class="field-with-info">
                <select id="dc-atk-ability" class="select-input"></select>
                <button class="info-btn" id="btn-dc-atk-ability-info" title="Info">i</button>
              </div>
            </div>
            <div class="calc-row">
              <label data-i18n="tb.item">Item</label>
              <div class="field-with-info">
                <div class="searchable-select" id="dc-atk-item-search">
                  <input type="text" class="search-input" placeholder="Search item..." data-i18n-placeholder="tb.searchItem">
                  <div class="search-dropdown"></div>
                </div>
                <button class="info-btn" id="btn-dc-atk-item-info" title="Info">i</button>
              </div>
            </div>
            <div class="calc-row">
              <label data-i18n="dc.move">Move</label>
              <div class="field-with-info">
                <div class="searchable-select" id="dc-atk-move-search">
                  <input type="text" class="search-input" placeholder="Search move..." data-i18n-placeholder="dc.searchMove">
                  <div class="search-dropdown"></div>
                </div>
                <button class="info-btn" id="btn-dc-atk-move-info" title="Info">i</button>
              </div>
            </div>
            <div class="calc-stat-grid" id="dc-atk-stats">
              <!-- Generated by JS -->
            </div>
          </div>
        </div>

        <!-- Results -->
        <div class="calc-results" id="dc-results">
          <div class="calc-results-inner">
            <div class="damage-arrow">⚔️</div>
            <div id="dc-result-text" class="result-text" data-i18n="dc.selectBoth">Select Pokémon and a move to calculate damage</div>
            <div id="dc-result-detail" class="result-detail"></div>
            <button id="dc-calculate" class="btn btn-primary" data-i18n="dc.calculate">Calculate</button>
          </div>
        </div>

        <!-- Defender -->
        <div class="calc-panel defender-panel">
          <h2 data-i18n="dc.defender">Defender</h2>
          <div class="calc-pokemon-select">
            <div class="searchable-select" id="dc-def-pokemon-search">
              <input type="text" class="search-input" placeholder="Search Pokémon..." data-i18n-placeholder="tb.searchPokemon">
              <div class="search-dropdown"></div>
            </div>
            <img id="dc-def-sprite" class="calc-sprite" src="" alt="">
          </div>
          <div class="calc-fields">
            <div class="calc-row">
              <label data-i18n="tb.level">Level</label>
              <input type="number" id="dc-def-level" class="num-input" min="1" max="100" value="50">
            </div>
            <div class="calc-row">
              <label data-i18n="tb.nature">Nature</label>
              <select id="dc-def-nature" class="select-input"></select>
            </div>
            <div class="calc-row">
              <label data-i18n="tb.ability">Ability</label>
              <div class="field-with-info">
                <select id="dc-def-ability" class="select-input"></select>
                <button class="info-btn" id="btn-dc-def-ability-info" title="Info">i</button>
              </div>
            </div>
            <div class="calc-row">
              <label data-i18n="tb.item">Item</label>
              <div class="field-with-info">
                <div class="searchable-select" id="dc-def-item-search">
                  <input type="text" class="search-input" placeholder="Search item..." data-i18n-placeholder="tb.searchItem">
                  <div class="search-dropdown"></div>
                </div>
                <button class="info-btn" id="btn-dc-def-item-info" title="Info">i</button>
              </div>
            </div>
            <div class="calc-stat-grid" id="dc-def-stats">
              <!-- Generated by JS -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- IV/EV Calculator View -->
    <section id="view-iv-ev-calc" class="view">
      <div class="iec-layout">
        <div class="iec-panel">
          <h2 data-i18n="iec.title">IV / EV Calculator</h2>
          <div class="iec-pokemon-select">
            <div class="searchable-select" id="iec-pokemon-search">
              <input type="text" class="search-input" placeholder="Search Pokémon..." data-i18n-placeholder="tb.searchPokemon">
              <div class="search-dropdown"></div>
            </div>
            <img id="iec-sprite" class="calc-sprite" src="" alt="">
          </div>
          <div class="iec-fields">
            <div class="calc-row">
              <label data-i18n="tb.level">Level</label>
              <input type="number" id="iec-level" class="num-input" min="1" max="100" value="50">
            </div>
            <div class="calc-row">
              <label data-i18n="tb.nature">Nature</label>
              <select id="iec-nature" class="select-input"></select>
            </div>
          </div>

          <div class="iec-mode-tabs">
            <button class="iec-tab active" data-mode="iv" data-i18n="iec.findIvs">Find IVs</button>
            <button class="iec-tab" data-mode="ev" data-i18n="iec.findEvs">Find EVs</button>
            <button class="iec-tab" data-mode="stat" data-i18n="iec.findStats">Stat Builder</button>
          </div>

          <div class="iec-stat-table" id="iec-stat-table">
            <!-- Generated by JS -->
          </div>

          <button id="iec-calculate" class="btn btn-primary" data-i18n="iec.calculate">Calculate</button>

          <div class="iec-results" id="iec-results">
            <!-- Results shown here -->
          </div>
        </div>

        <!-- Stat Radar Chart -->
        <div class="iec-chart-panel">
          <canvas id="stat-radar" width="400" height="400"></canvas>
          <div class="iec-base-stats" id="iec-base-stats">
            <!-- Base stat bars -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Info Popup -->
  <div class="info-popup-overlay" id="info-popup" style="display:none;">
    <div class="info-popup">
      <div class="info-popup-header">
        <h3 id="info-popup-title"></h3>
        <button class="modal-close" id="info-popup-close">&times;</button>
      </div>
      <div class="info-popup-body" id="info-popup-body">
        <div class="spinner" style="margin:20px auto"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>PokéBuilder — Data from <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a></p>
  </footer>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <p data-i18n="app.loading">Loading...</p>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
